app = "ochre-eights"
primary_region = "arn"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # in-memory rooms: the machine must stay up
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Fly scrapes Prometheus metrics from the app and serves them to the managed
# Grafana at fly-metrics.net; the endpoint is exposed by server/src/metrics.ts.
[metrics]
  port = 3000
  path = "/metrics"
